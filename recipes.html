<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eco Plate — AI Chef</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>
  <body>
    
    <nav class="main-nav" aria-label="Primary">
      <div class="nav-container">
        <a href="/" class="logo">Eco Plate 🌿</a>
        <ul class="nav-list">
          <li><a class="nav-link" href="/">Home</a></li>
          <li><a class="nav-link active" href="/recipes.html">Recipes</a></li>
          <li><a class="nav-link" href="/pantry.html">Pantry</a></li>
          <li><a class="nav-link" href="/motivation.html">Mission</a></li>
        </ul>
      </div>
    </nav>

    <div class="card">
      <div class="header-row">
        <h1><i class="fa-solid fa-robot" style="color:#2e7d32;"></i> AI Chef</h1>
        <div class="impact-badge">
          <i class="fa-solid fa-carrot"></i> Impact: <span id="impactCount">0</span> Saved
        </div>
      </div>
      
      <div class="chat-container">
        <ul class="chat" id="messages">
          <li class="bot">
            Hello! I'm your Sustainable Sous-Chef. 
            <br>Tell me what you want to cook, or 
            <a href="#" id="usePantryLink">load ingredients from your pantry</a>.
          </li>
        </ul>
        
        <div class="controls chat-controls">
          <input id="ingredients" type="text" placeholder="Type ingredients (e.g. Tomato, Basil)..." />
          <button id="send" class="send-btn">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
      
      <div style="margin-top: 10px; font-size: 0.9rem; color: #666; text-align: center;">
           <span id="pantryStatus"></span>
      </div>

      <div class="results" id="results"></div>
    </div>

    <!-- NEW: Recipe Details Modal -->
    <div id="recipeModal" class="modal hidden">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div id="modalBody">
          <!-- Details injected here by JS -->
          <div class="loader">Loading recipe details...</div>
        </div>
      </div>
    </div>

    <script src="/src/recipes.js"></script>
  </body>
</html>
